[pytest]
asyncio_mode = auto
pythonpath = .
markers =
    integration: integration tests that require Docker or large external fixtures

# Integration tests are excluded from the default run because they are minutes-long,
# not seconds-long. Each RAW conversion starts a container from a 9.26 GB image and
# provisions a fresh Wine prefix; a single conversion measured 57.8 s on this host,
# and the whole marked set can stall far longer when the Docker host is already
# busy. Run them deliberately: pytest -m integration
addopts = -m "not integration"
