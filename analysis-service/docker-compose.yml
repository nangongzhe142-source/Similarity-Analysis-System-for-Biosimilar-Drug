name: bsim-analysis

services:
  analysis-api:
    build:
      context: .
    container_name: bsim-analysis-api
    ports:
      - "8765:8765"
    environment:
      WORKSPACE_ROOT: /app/workspaces
      CORS_ORIGINS: http://localhost:3000
      MAX_CONCURRENT_JOBS: "2"
    volumes:
      - ./workspaces:/app/workspaces
    restart: unless-stopped
