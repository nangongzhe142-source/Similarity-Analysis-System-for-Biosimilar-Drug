    - data:
        code: "def main(query: str) -> dict:\n    q = (query or '').strip()\n    low\
          \ = q.lower()\n    is_empty = 1 if len(q) == 0 else 0\n    is_override =\
          \ 1 if (('忽略' in q and '规则' in q) or ('ignore' in low and 'instruction'\
          \ in low) or 'system prompt' in low or 'api key' in low) else 0\n    is_product\
          \ = 1 if (('生物类似药' in q and ('是不是' in q or '是否为' in q or '直接判定' in q)) or\
          \ ('biosimilar' in low and ('is this' in low or 'is the product' in low)))\
          \ else 0\n    is_image = 1 if ((('图' in q or 'png' in low or 'jpeg' in low)\
          \ and ('峰' in q or '分子量' in q or '覆盖率' in q)) or ('guess' in low and 'peak'\
          \ in low)) else 0\n    return {'clean_query': q[:4000], 'is_empty': is_empty,\
          \ 'is_override': is_override, 'is_product': is_product, 'is_image': is_image}\n"
        code_language: python3
