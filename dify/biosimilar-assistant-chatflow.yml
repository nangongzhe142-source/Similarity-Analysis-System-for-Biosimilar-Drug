              return {
                  'clean_query': q[:4000],
                  'is_empty': is_empty,
                  'is_override': is_override,
                  'is_product': is_product,
                  'is_image': is_image,
                  'pageUrl': blank(pageUrl),
                  'pageTitle': blank(pageTitle),
