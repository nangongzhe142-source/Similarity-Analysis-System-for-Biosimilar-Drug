    - data:
        code: |
          def main(original_result, review_result) -> dict:
              from datetime import datetime, timezone
              import re
              def as_list(value):
                  return value if isinstance(value, list) else []
              def meta_of(item):
                  if not isinstance(item, dict):
                      return {}
                  meta = item.get('metadata')
                  return meta if isinstance(meta, dict) else {}
              def title_of(item):
                  if not isinstance(item, dict):
                      return ''
                  return str(item.get('title') or item.get('document_name') or '')
              def content_of(item):
                  if not isinstance(item, dict):
                      return str(item)
                  return str(item.get('content') or '')
              def is_approved(item):
                  meta = meta_of(item)
                  status = str(meta.get('status') or '').strip().lower()
                  if status:
                      return status == 'approved'
                  return bool(re.search(r'(?im)^status:\s*approved\s*$', content_of(item)))
              def expire_raw(item):
                  meta = meta_of(item)
                  raw = str(meta.get('expireAt') or meta.get('expire_at') or '').strip()
                  if raw:
                      return raw
                  match = re.search(r'(?im)^expireAt:\s*(\S+)\s*$', content_of(item))
                  return match.group(1).strip() if match else ''
              def is_expired(item):
                  raw = expire_raw(item)
                  if raw in ('', '空', 'null', 'None', '-'):
                      return False
                  text = raw.replace('Z', '+00:00')
                  try:
                      parsed = datetime.fromisoformat(text)
                  except Exception:
                      return False
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  return parsed <= datetime.now(timezone.utc)
              def pack(items, nature):
                  texts = []
                  for item in items[:8]:
                      title = title_of(item)
                      content = content_of(item)
                      texts.append(('[' + nature + '|' + title + '] ' + content).strip())
                  return texts
              original_items = as_list(original_result)[:8]
              review_items = []
              for item in as_list(review_result)[:12]:
                  if is_approved(item) and not is_expired(item):
                      review_items.append(item)
              review_items = review_items[:8]
              original_texts = pack(original_items, '原库')
              review_texts = pack(review_items, '人工复核')
              original_evidence = '\n\n'.join(original_texts)[:8000]
              review_evidence = '\n\n'.join(review_texts)[:8000]
              merged = []
              if review_evidence:
                  merged.append('## 人工复核（已批准且未过期）\n' + review_evidence)
              if original_evidence:
                  merged.append('## 原知识库\n' + original_evidence)
              evidence = '\n\n'.join(merged)[:12000]
              return {
                  'hit_count': len(original_items) + len(review_items),
                  'review_hit_count': len(review_items),
                  'original_evidence': original_evidence,
                  'review_evidence': review_evidence,
                  'evidence': evidence,
              }
        code_language: python3
        desc: 合并两库；复核库只保留已批准且未过期
