          def main(query: str, pageUrl: str, pageTitle: str, locale: str, categoryKey: str, itemId: str, itemName: str, methodId: str, methodName: str, analysisStatus: str, analysisResult: str, analysisProvenance: str) -> dict:
              def blank(value):
                  text = (value or '').strip()
                  return text if text else '空'
              q = (query or '').strip()
              low = q.lower()
              is_empty = 1 if len(q) == 0 else 0
              is_override = 1 if (('忽略' in q and '规则' in q) or ('ignore' in low and 'instruction' in low) or 'system prompt' in low or 'api key' in low) else 0
              is_product = 1 if (('生物类似药' in q and ('是不是' in q or '是否为' in q or '直接判定' in q)) or ('biosimilar' in low and ('is this' in low or 'is the product' in low))) else 0
