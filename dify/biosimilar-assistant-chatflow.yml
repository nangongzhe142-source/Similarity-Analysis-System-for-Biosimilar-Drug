    - data:
        code: |
          def main(action_id: str, correctedExplanation: str, scope: str, evidenceUsed: str, knowledgeNature: str, mustNotClaim: str, reviewerId: str, reviewedAt: str, expireAt: str, query: str, itemId: str, methodId: str, locale: str, analysisResult: str, original_evidence: str, review_evidence: str) -> dict:
              import json
              import re
              from datetime import datetime, timezone
              natures = {'规则原文备忘', '方法学解释', '系统操作', '案例说明', '演示说明'}
              approve = {'approve_explanation', 'revise_explanation'}
              product_claim = re.compile(r'(是生物类似药|不是生物类似药|整品认定|is a biosimilar|is not a biosimilar)', re.I)
              rewrite = re.compile(r'(把当次|改写当次|改为通过|改为不通过|改成通过|改成不通过|change (the )?verdict|set verdict)', re.I)
              ignore_red = re.compile(r'(忽略红线|ignore (the )?red.?line)', re.I)
              action = (action_id or '').strip()
              if action == 'insuff_evidence':
                  action = 'insufficient_evidence'
              reasons = []
              if action not in approve:
                  reasons.append('reviewDecision不是approve_explanation或revise_explanation')
              expl = (correctedExplanation or '').strip()
              if not expl:
                  reasons.append('correctedExplanation为空')
              scope_text = (scope or '').strip()
              must_not = (mustNotClaim or '').strip()
              blob = expl + '\n' + scope_text + '\n' + must_not
              if product_claim.search(blob):
                  reasons.append('含整品认定')
              if rewrite.search(blob):
                  reasons.append('试图改写当次数值或状态')
              if ignore_red.search(blob):
                  reasons.append('要求忽略红线')
              nature = (knowledgeNature or '').strip()
              if nature not in natures:
                  reasons.append('knowledgeNature不在允许列表')
              reviewer = (reviewerId or '').strip()
              if not reviewer:
                  reasons.append('缺少reviewerId')
              evid = (evidenceUsed or '').strip()
              if not evid:
                  reasons.append('缺少evidenceUsed')
              elif evid != '仅系统操作说明、无监管结论':
                  pool = evid + '\n' + (original_evidence or '') + '\n' + (review_evidence or '')
                  for token in re.findall(r'\d+(?:\.\d+)?', expl):
                      if token not in pool:
                          reasons.append('解释中出现未在证据中的数值、阈值、页码或文献标识')
                          break
              if nature == '演示说明' and re.search(r'(监管结论|审评通过|获批生物类似药)', expl):
                  reasons.append('把模拟或演示写成真实监管结论')
              result_text = analysisResult or ''
              if re.search(r'\b(REVIEW|BLOCKED|RULE_NOT_DEFINED)\b', result_text) and re.search(r'(改为通过|改成通过|判定通过)', expl):
                  reasons.append('把当次REVIEW或BLOCKED改写为通过')
              ts = (reviewedAt or '').strip()
              if not ts:
                  ts = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
              expire = (expireAt or '').strip()
              raw_item = (itemId or '').strip()
              slug = 'general' if raw_item in ('', '空') else re.sub(r'[^A-Za-z0-9._-]+', '-', raw_item)[:40] or 'general'
              day = re.sub(r'[^0-9]', '', ts)[:8]
              if len(day) < 8:
                  day = datetime.now(timezone.utc).strftime('%Y%m%d')
              filename = 'review-' + slug + '-' + day + '.md'
              loc = (locale or '').strip()
              if loc in ('', '空'):
                  loc = ''
              method = (methodId or '').strip()
              if method == '空':
                  method = ''
              if reasons:
                  return {
                      'should_ingest': 0,
                      'document_name': '',
                      'request_body': '',
                      'reject_json': json.dumps({'action': 'reject', 'reason': '；'.join(reasons)}, ensure_ascii=False),
                  }
              markdown = '\n'.join([
                  '---',
                  'sourceType: human-review',
                  'status: approved',
                  'reviewerId: ' + reviewer,
                  'reviewedAt: ' + ts,
                  'expireAt: ' + expire,
                  'itemId: ' + ('' if raw_item == '空' else raw_item),
                  'methodId: ' + method,
                  'locale: ' + loc,
                  'knowledgeNature: ' + nature,
                  'evidenceLevel: human-reviewed-note',
                  'mustNotClaim: ' + must_not.replace('\n', ' ').strip(),
                  '---',
                  '',
                  '# 以后解释口径',
                  expl,
                  '',
                  '# 适用范围',
                  scope_text,
                  '',
                  '# 证据',
                  evid,
                  '',
                  '# 禁止表述',
                  must_not,
                  '',
                  '# 对应问题',
                  (query or '').strip(),
                  '',
              ])
              payload = {
                  'name': filename,
                  'text': markdown,
                  'indexing_technique': 'high_quality',
                  'doc_form': 'text_model',
                  'doc_language': 'English' if loc == 'en' else 'Chinese',
                  'process_rule': {'mode': 'automatic'},
              }
              return {
                  'should_ingest': 1,
                  'document_name': filename,
                  'request_body': json.dumps(payload, ensure_ascii=False),
                  'reject_json': '',
              }
